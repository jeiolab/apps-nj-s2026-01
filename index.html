<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학사일정</title>
<style>
  /* 2026-09-28 큐: 세 행 배치(본문 / 급식 / 알림). 기준 640×264, 모든 치수는 border-box. 기존 시계·수업·알림·급식·날씨·달력·JSONP 갱신 로직은 그대로다. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; }
  body {
    background:#0b0d10; color:#f2f2f2;
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
    display:grid;
    grid-template-rows:minmax(0,1fr) 30px 24px;
    gap:6px;
    padding:8px;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    font-variant-numeric:tabular-nums;
  }

  /* ---- 1행: 왼쪽 상태 패널 + 달력 ---- */
  #main { display:grid; grid-template-columns:196px minmax(0,1fr); gap:8px; min-height:0; min-width:0; }
  #left { min-width:0; min-height:0; display:flex; flex-direction:column; gap:4px; overflow:hidden; }

  #clock { display:flex; align-items:baseline; justify-content:flex-start; line-height:1; gap:4px; }
  #hm  { font-size:44px; font-weight:700; letter-spacing:-1px; }
  #sec { font-size:14px; font-weight:500; color:#8b949e; min-width:2ch; }
  #dateLine { font-size:13px; color:#a0a6ad; margin-top:-2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #class {
    margin-top:4px; padding:5px 8px; border-radius:6px;
    background:#161b22; border:1px solid #21262d;
    display:flex; flex-direction:column; gap:1px; min-width:0;
    transition:background .4s, border-color .4s;
  }
  #class.now  { border-color:#2ea04366; background:#1b2a1f; }
  #class.soon { border-color:#e8912d88; background:#2a2115; animation:blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { background:#3a2b12; } }
  #classState { font-size:11px; color:#8b949e; letter-spacing:.5px; }
  #class.now  #classState { color:#3fb950; }
  #class.soon #classState { color:#ffb45c; }
  #classMain { font-size:20px; font-weight:700; color:#fff; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #classTime { font-size:12px; color:#8b949e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 날씨: 기본은 아이콘·온도·지역·최저/최고, 나머지는 펼쳐 보기 */
  #wx { margin-top:auto; position:relative; min-width:0; }
  #wx summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; min-width:0; outline:none; border-radius:6px; padding:2px 4px; }
  #wx summary::-webkit-details-marker { display:none; }
  #wx summary:focus-visible { box-shadow:0 0 0 2px #58a6ff66; }
  #wxIcon { color:#f2a33c; display:flex; align-items:center; flex:none; }
  #wxIcon svg { width:28px; height:28px; }
  #wxTemp { font-size:22px; font-weight:700; line-height:1; flex:none; }
  #wxTemp small { font-size:11px; font-weight:500; margin-left:1px; }
  #wxMeta { min-width:0; display:flex; flex-direction:column; line-height:1.2; }
  #wxName { font-size:12px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #wxRange { font-size:11px; color:#a0a6ad; white-space:nowrap; }
  #wxMore { font-size:11px; color:#8b949e; padding:3px 6px 1px; display:flex; gap:10px; flex-wrap:wrap; }
  #wxMore span { display:inline-flex; align-items:center; gap:3px; }

  #cal { min-width:0; min-height:0; display:flex; flex-direction:column; }
  #calHead { display:flex; align-items:center; justify-content:center; gap:6px; height:20px; flex:none; }
  #monthTitle { font-size:14px; font-weight:600; letter-spacing:-.2px; min-width:96px; text-align:center; }
  .nav { width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#8b949e; cursor:pointer; border-radius:4px; border:0; background:transparent; }
  .nav:hover, .nav:focus-visible { background:#ffffff14; color:#fff; outline:none; }
  #grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); grid-template-rows:14px repeat(6, minmax(0,1fr)); gap:1px 2px; }
  .dow { font-size:10px; color:#8b949e; text-align:center; line-height:14px; }
  .dow.sun, .cell.sun .dnum { color:#e8912d; }
  .dow.sat, .cell.sat .dnum { color:#e8912d; }
  .cell { min-width:0; min-height:0; border-radius:4px; padding:1px 3px 0; display:flex; flex-direction:column; align-items:center; overflow:hidden; cursor:default; border:1px solid transparent; }
  .cell.has { cursor:pointer; }
  .cell.has:hover, .cell:focus-visible { background:#ffffff0d; outline:none; }
  .cell.today { background:#e8912d1f; border-color:#e8912d66; }
  .cell.other .dnum { color:#4a4f56 !important; }
  .dnum { font-size:12px; font-weight:500; line-height:1.1; }
  .dots { display:flex; gap:2px; height:5px; margin-top:1px; }
  .dot { width:4px; height:4px; border-radius:50%; background:#7ee787; }
  .dot.main { background:#ffa657; }
  .evline { display:none; font-size:9px; color:#7ee787; line-height:1.2; width:100%; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .evline.main { color:#ffa657; }
  /* 창이 넉넉할 때(높이 320px 이상)만 행사 제목 한 줄을 더 보여 준다 */
  body.tall .evline { display:block; }
  body.tall .dots { display:none; }
  body.tall .dnum { font-size:13px; }

  /* ---- 2행: 급식 ---- */
  #mealRow { min-width:0; height:30px; display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:6px; background:#11151a; border:1px solid #1c2128; cursor:pointer; }
  #mealRow:focus-visible { outline:none; box-shadow:0 0 0 2px #58a6ff66; }
  #mealLabel { flex:none; font-size:12px; font-weight:600; color:#e8912d; }
  #dishes { flex:1; min-width:0; font-size:13px; color:#e6edf3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dishes.muted { color:#6e7681; }
  #kcal { flex:none; font-size:11px; color:#6e7681; white-space:nowrap; }

  /* ---- 3행: 알림 + 다음 일정 ---- */
  /* 오른쪽 열은 fit-content(46%): 내용만큼 쓰되 컨테이너의 46%를 넘지 않는다(항목의 max-width:%는 그리드 영역 기준이라 여기서 정한다) */
  #ticker { min-width:0; height:24px; display:grid; grid-template-columns:minmax(0,1fr) fit-content(46%); align-items:center; gap:8px; padding:0 8px; border-radius:6px; background:#11151a; border:1px solid #1c2128; }
  #tkLeft { min-width:0; display:flex; align-items:center; gap:6px; cursor:pointer; }
  #tkLeft:focus-visible, #tkRight:focus-visible { outline:none; box-shadow:0 0 0 2px #58a6ff66; border-radius:4px; }
  #tkTag { flex:none; font-size:11px; font-weight:700; color:#f85149; letter-spacing:.5px; }
  #tkText { min-width:0; font-size:12px; color:#e6edf3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tkText b { color:#ffa657; font-weight:600; }
  #tkText.muted { color:#6e7681; }
  #tkRight { min-width:0; width:100%; display:flex; align-items:center; gap:5px; cursor:pointer; overflow:hidden; }
  #tkRight.hide { display:none; }
  #nxLabel { flex:none; font-size:11px; color:#8b949e; }
  #nxTime { flex:none; font-size:12px; font-weight:700; color:#ffa657; }
  #nxTitle { min-width:0; font-size:12px; color:#e6edf3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- 상세 보기 (한 개, 창 안에서만) ---- */
  #detail { position:fixed; left:8px; right:8px; bottom:8px; z-index:900; display:none; max-height:calc(100% - 16px); overflow:auto; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 10px; box-shadow:0 8px 24px #000a; }
  #detail.on { display:block; }
  #detail h4 { font-size:12px; color:#8b949e; font-weight:600; margin-bottom:4px; display:flex; justify-content:space-between; }
  #detail h4 span { color:#6e7681; font-weight:400; }
  #detail ul { list-style:none; }
  #detail li { font-size:13px; color:#e6edf3; line-height:1.45; overflow-wrap:anywhere; }
  #detail li b { color:#ffa657; font-weight:600; }
  #detail li.main { color:#ffa657; }

  /* ---- 전체화면 알림 (기존) ---- */
  #alert { position:fixed; inset:0; z-index:999; display:none; flex-direction:column; align-items:center; justify-content:center; background:#e8912d; color:#1a1200; cursor:pointer; }
  #alert.on { display:flex; animation:flash 1s steps(1,end) infinite; }
  @keyframes flash { 0%,49% { background:#e8912d; color:#1a1200; } 50%,100% { background:#1a1200; color:#e8912d; } }
  #alertTop  { font-size:min(44px, 8vh); font-weight:600; letter-spacing:6px; }
  #alertMain { font-size:min(190px, 40vh); font-weight:800; line-height:1; letter-spacing:-6px; }
  #alertSub  { font-size:min(40px, 8vh); font-weight:500; margin-top:6px; }
  #alertHint { position:absolute; bottom:12px; font-size:min(18px, 4vh); opacity:.7; }

  #err { position:fixed; top:4px; right:8px; font-size:10px; color:#f85149; }
</style>
</head>
<body>

<div id="main">
  <div id="left">
    <div id="clock"><span id="hm">--:--</span><span id="sec">--</span></div>
    <div id="dateLine">----------</div>

    <div id="class">
      <span id="classState">수업</span>
      <span id="classMain">—</span>
      <span id="classTime"></span>
    </div>

    <details id="wx">
      <summary title="일출·일몰·풍속 보기">
        <div id="wxIcon"></div>
        <div id="wxTemp">--<small>°C</small></div>
        <div id="wxMeta">
          <div id="wxName">--</div>
          <div id="wxRange">최저 <span id="tmin">--</span>° · 최고 <span id="tmax">--</span>°</div>
        </div>
      </summary>
      <div id="wxMore">
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 18h18M12 3v6M8 9l4-4 4 4M5 14l1 1M19 14l-1 1"/></svg>일출 <span id="sunrise">--:--</span></span>
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 18h18M12 9V3M8 5l4 4 4-4M5 14l1 1M19 14l-1 1"/></svg>일몰 <span id="sunset">--:--</span></span>
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h9"/></svg>바람 <span id="wind">--</span> km/h</span>
      </div>
    </details>
  </div>

  <div id="cal">
    <div id="calHead">
      <button class="nav" type="button" onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
      <div id="monthTitle">—</div>
      <button class="nav" type="button" onclick="moveMonth(1)" aria-label="다음 달">›</button>
    </div>
    <div id="grid" role="grid" aria-label="월간 달력"></div>
  </div>
</div>

<div id="mealRow" tabindex="0" role="button" aria-label="급식 전체 보기">
  <span id="mealLabel">급식</span>
  <span id="dishes" class="muted">불러오는 중…</span>
  <span id="kcal"></span>
</div>

<div id="ticker">
  <div id="tkLeft" tabindex="0" role="button" aria-label="알림 전체 보기">
    <span id="tkTag">큐 알림</span>
    <span id="tkText" class="muted">알림 없음</span>
  </div>
  <div id="tkRight" class="hide" tabindex="0" role="button" aria-label="다음 일정 전체 보기">
    <span id="nxLabel">다음 일정</span>
    <span id="nxTime"></span>
    <span id="nxTitle"></span>
  </div>
</div>

<div id="detail" role="dialog" aria-live="polite"><h4><span id="detailTitle"></span><span>창 밖을 누르거나 Esc로 닫기</span></h4><ul id="detailList"></ul></div>

<div id="alert" onclick="closeAlert()">
  <div id="alertTop">수업 시작</div>
  <div id="alertMain">—</div>
  <div id="alertSub"></div>
  <div id="alertHint">화면을 터치하면 닫힙니다</div>
</div>

<div id="err"></div>

<script>
/* ===== Apps Script 주소 ===== */
var API = 'https://script.google.com/macros/s/AKfycbxXYMueYS6ex0eoF3Xp1-WkDOvdSW6j9sYJeEbQ8gAN74ZEScEc-Fp8lm69J2OwtEzg0A/exec';

/* ===== 알림 설정 ===== */
var ALERT_SECONDS = 15;   // 전체화면 알림 표시 시간

var DATA = null, viewY = null, viewM = null, lastNav = 0, cbSeq = 0;
var firedKey = null, alertTimer = null;
var DOW = ['일', '월', '화', '수', '목', '금', '토'];

/* ===== 데이터 (JSONP) — 기존 그대로 ===== */
function load() {
  var name = 'cb' + (++cbSeq);
  var s = document.createElement('script');
  var done = false;

  window[name] = function(d) {
    done = true;
    document.getElementById('err').textContent = '';
    onData(d);
    delete window[name];
    if (s.parentNode) s.parentNode.removeChild(s);
  };

  s.src = API + '?callback=' + name + '&t=' + Date.now();
  s.onerror = function() {
    document.getElementById('err').textContent = '데이터 연결 실패';
    delete window[name];
    if (!DATA) { setMealState('급식을 불러오지 못했습니다'); }
  };
  document.head.appendChild(s);

  setTimeout(function() {
    if (!done) document.getElementById('err').textContent = '응답 지연';
  }, 15000);
}

function onData(d) {
  DATA = d;
  var t = d.today.split('-');
  if (viewY === null || Date.now() - lastNav > 120000) {
    viewY = +t[0]; viewM = +t[1];
  }
  renderMeal(d.meal);
  renderWeather(d.weather);
  drawCalendar();
  renderClass(new Date());
  renderTicker(d.q);
}

/* ===== 시계 (계산 방식은 기존 그대로, 날짜 표기만 「9월 28일 월요일」) ===== */
function tick() {
  var n = new Date();
  document.getElementById('hm').textContent = p(n.getHours()) + ':' + p(n.getMinutes());
  document.getElementById('sec').textContent = p(n.getSeconds());
  document.getElementById('dateLine').textContent =
    (n.getMonth() + 1) + '월 ' + n.getDate() + '일 ' + DOW[n.getDay()] + '요일';
  renderClass(n);
}
function p(n) { return (n < 10 ? '0' : '') + n; }

function toMin(hhmm) {
  var a = hhmm.split(':');
  return (+a[0]) * 60 + (+a[1]);
}

/* ===== 수업 — 기존 로직 그대로, 문구 위계만 정리 ===== */
function todayList(n) {
  var rows = DATA.timetable[n.getDay()];
  if (!rows) return [];
  var list = [];
  for (var i = 0; i < DATA.periods.length; i++) {
    if (rows[i] === null || rows[i] === undefined) continue;
    list.push({
      no: DATA.periods[i].no, cls: rows[i],
      s: toMin(DATA.periods[i].start), e: toMin(DATA.periods[i].end),
      stext: DATA.periods[i].start, etext: DATA.periods[i].end
    });
  }
  return list;
}

function renderClass(n) {
  if (!DATA) return;

  var box   = document.getElementById('class');
  var state = document.getElementById('classState');
  var main  = document.getElementById('classMain');
  var time  = document.getElementById('classTime');
  box.className = '';

  var list = todayList(n);
  if (list.length === 0) {
    state.textContent = '수업'; main.textContent = '없음'; time.textContent = '';
    return;
  }

  var nowMin = n.getHours() * 60 + n.getMinutes();

  // 수업 중
  for (var j = 0; j < list.length; j++) {
    if (nowMin >= list[j].s && nowMin < list[j].e) {
      box.className = 'now';
      state.textContent = '수업 중';
      main.textContent  = list[j].no + '교시 · ' + list[j].cls + '반';
      time.textContent  = '종료까지 ' + (list[j].e - nowMin) + '분';
      // 시작 직후 1분 안이면 전체화면 알림
      if (nowMin === list[j].s) tryAlert(n, list[j]);
      return;
    }
  }

  // 다음 수업
  for (var k = 0; k < list.length; k++) {
    if (list[k].s > nowMin) {
      var left = list[k].s - nowMin;
      if (left <= DATA.alertMin) {
        box.className = 'soon';
        state.textContent = left + '분 후 시작';
      } else {
        state.textContent = '다음 수업';
      }
      main.textContent = list[k].no + '교시 · ' + list[k].cls + '반';
      time.textContent = list[k].stext + ' – ' + list[k].etext;
      return;
    }
  }

  state.textContent = '오늘 수업'; main.textContent = '종료'; time.textContent = '';
}

/* ===== 전체화면 알림 — 기존 그대로 ===== */
function tryAlert(n, item) {
  var key = n.toDateString() + '_' + item.no;
  if (firedKey === key) return;      // 같은 교시는 한 번만
  firedKey = key;

  document.getElementById('alertMain').textContent = item.cls + '반';
  document.getElementById('alertSub').textContent =
    item.no + '교시  ·  ' + item.stext + ' - ' + item.etext;
  document.getElementById('alert').classList.add('on');

  clearTimeout(alertTimer);
  alertTimer = setTimeout(closeAlert, ALERT_SECONDS * 1000);
}

function closeAlert() {
  clearTimeout(alertTimer);
  document.getElementById('alert').classList.remove('on');
}

/* ===== 급식: 한 줄 요약 + 상세 보기 ===== */
var MEAL = null;
function setMealState(text) {
  var el = document.getElementById('dishes');
  el.textContent = text; el.className = 'muted';
  document.getElementById('kcal').textContent = '';
}
function renderMeal(m) {
  MEAL = m || null;
  document.getElementById('mealLabel').textContent = (m && m.label) || '급식';
  if (!m) { setMealState('급식 정보 없음'); return; }
  if (!m.hasMeal) { setMealState('급식 없음'); return; }
  var el = document.getElementById('dishes');
  el.textContent = m.dishes.join(' · ');
  el.className = '';
  el.title = m.dishes.join(', ');
  document.getElementById('kcal').textContent = m.kcal || '';
}

/* ===== 날씨: 기본 정보 + 펼쳐 보기(일출·일몰·풍속) ===== */
function renderWeather(w) {
  if (!w || !w.ok) {
    document.getElementById('wxName').textContent = w ? w.name : '--';
    return;
  }
  document.getElementById('wxTemp').innerHTML = w.temp + '<small>°C</small>';
  document.getElementById('wxName').textContent = w.name;
  document.getElementById('tmin').textContent = w.tmin;
  document.getElementById('tmax').textContent = w.tmax;
  document.getElementById('wind').textContent = w.wind;
  document.getElementById('sunrise').textContent = w.sunrise;
  document.getElementById('sunset').textContent = w.sunset;
  document.getElementById('wxIcon').innerHTML = iconFor(w.code);
}

function iconFor(c) {
  var S = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"';
  if (c === 0 || c === 1)
    return '<svg ' + S + '><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>';
  if (c === 2 || c === 3)
    return '<svg ' + S + '><circle cx="8.5" cy="8.5" r="3.2"/><path d="M17 19H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 19z"/></svg>';
  if (c >= 45 && c <= 48)
    return '<svg ' + S + '><path d="M3 8h18M3 12h18M3 16h13M3 20h9"/></svg>';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82))
    return '<svg ' + S + '><path d="M17 15H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 15z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></svg>';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86)
    return '<svg ' + S + '><path d="M17 14H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 14z"/><path d="M9 18h.01M13 19h.01M17 18h.01"/></svg>';
  if (c >= 95)
    return '<svg ' + S + '><path d="M17 13H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 13z"/><path d="M13 15l-3 4h4l-3 4"/></svg>';
  return '<svg ' + S + '><path d="M17 18H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 18z"/></svg>';
}

/* ===== 달력: 7열 그리드, 날짜 + 일정 점, 누르면 그날 일정 전체 ===== */
function moveMonth(delta) {
  lastNav = Date.now();
  viewM += delta;
  if (viewM < 1)  { viewM = 12; viewY--; }
  if (viewM > 12) { viewM = 1;  viewY++; }
  drawCalendar();
}

function drawCalendar() {
  if (!DATA) return;
  document.getElementById('monthTitle').textContent = viewY + '년 ' + viewM + '월';

  var first = new Date(viewY, viewM - 1, 1).getDay();
  var last  = new Date(viewY, viewM, 0).getDate();
  var prevLast = new Date(viewY, viewM - 1, 0).getDate();
  var grid = document.getElementById('grid');
  grid.textContent = '';

  for (var h = 0; h < 7; h++) {
    var dow = document.createElement('div');
    dow.className = 'dow' + (h === 0 ? ' sun' : (h === 6 ? ' sat' : ''));
    dow.textContent = DOW[h];
    grid.appendChild(dow);
  }

  var day = 1, nextDay = 1;
  for (var w = 0; w < 6; w++) {
    for (var c = 0; c < 7; c++) {
      var cell = document.createElement('div');
      var cls = 'cell' + (c === 0 ? ' sun' : (c === 6 ? ' sat' : ''));
      var num, ds = null;
      if (w === 0 && c < first) { num = prevLast - first + c + 1; cls += ' other'; }
      else if (day > last)      { num = nextDay++; cls += ' other'; }
      else {
        num = day;
        ds = viewY + '-' + p(viewM) + '-' + p(day);
        if (ds === DATA.today) cls += ' today';
        day++;
      }
      var dn = document.createElement('span'); dn.className = 'dnum'; dn.textContent = num; cell.appendChild(dn);
      var items = ds ? (DATA.eventMap[ds] || []) : [];
      if (items.length) {
        cls += ' has';
        var dots = document.createElement('div'); dots.className = 'dots';
        items.slice(0, 3).forEach(function(i) { var d = document.createElement('span'); d.className = 'dot' + (i.type === '주요행사' ? ' main' : ''); dots.appendChild(d); });
        cell.appendChild(dots);
        var ev = document.createElement('div'); ev.className = 'evline' + (items[0].type === '주요행사' ? ' main' : '');
        ev.textContent = items[0].text + (items.length > 1 ? ' 외 ' + (items.length - 1) : '');
        cell.appendChild(ev);
        cell.title = items.map(function(i) { return '[' + i.type + '] ' + i.text; }).join('\n');
        cell.tabIndex = 0;
        cell.setAttribute('role', 'button');
        cell.setAttribute('aria-label', (viewM) + '월 ' + num + '일 일정 ' + items.length + '건');
        (function(cell, ds, items) {   // 반복문의 var cell 은 마지막 칸을 가리키므로 인자로 묶는다
          cell.onclick = function(e) { e.stopPropagation(); showDetail(ds.replace(/^\d+-0?(\d+)-0?(\d+)$/, '$1월 $2일') + ' 일정', items.map(function(i) { return { k: i.type, t: i.text, main: i.type === '주요행사' }; }), 'cal'); };
          cell.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cell.onclick(e); } };
        })(cell, ds, items);
      }
      cell.className = cls;
      grid.appendChild(cell);
    }
  }
}

/* ===== 3행: 큐 알림(왼쪽) + 다음 일정(오른쪽). 앱스 스크립트가 q:{at, items:[{k,t,until}]}를 실어 준다 ===== */
var lastQ = null, lastKey = null;
function renderTicker(q) {
  lastQ = q;
  var now = Date.now();
  var items = (q && q.items) ? q.items.filter(function(x){ return x && x.t && !(x.until && Date.parse(x.until) < now); }) : [];
  var sig = items.map(function(x){ return (x.k || '') + '|' + x.t; }).join('\n');
  if (sig === lastKey) return;
  lastKey = sig;
  var dbox = document.getElementById('detail');
  if (dbox.classList.contains('on') && (dbox.dataset.kind === 'ticker' || dbox.dataset.kind === 'next')) hideDetail();   // 알림 내용이 바뀌면 알림·다음 일정 상세만 닫는다(급식·달력 상세는 그대로)

  var next = null, rest = [];
  items.forEach(function(x) {
    var m = /^다음\s+(\d\d:\d\d)$/.exec(x.k || '');
    if (m && !next) next = { time: m[1], t: x.t }; else rest.push(x);
  });

  var right = document.getElementById('tkRight');
  if (next) {
    right.classList.remove('hide');
    document.getElementById('nxTime').textContent = next.time;
    document.getElementById('nxTitle').textContent = next.t;
    right.title = next.time + ' ' + next.t;
  } else { right.classList.add('hide'); right.title = ''; }

  var el = document.getElementById('tkText');
  el.textContent = '';
  if (!rest.length) { el.textContent = next ? '' : '알림 없음'; el.className = 'muted'; }
  else {
    el.className = '';
    rest.forEach(function(x, i) {
      if (i) el.appendChild(document.createTextNode('  ·  '));
      if (x.k) { var b = document.createElement('b'); b.textContent = x.k + ' '; el.appendChild(b); }
      el.appendChild(document.createTextNode(String(x.t)));
    });
  }
  document.getElementById('tkLeft').title = rest.map(function(x) { return (x.k ? x.k + ' ' : '') + x.t; }).join('\n');
}
setInterval(function(){ if (lastQ) renderTicker(lastQ); }, 60000);   // 분마다 지난 줄을 걸러낸다

/* ===== 상세 보기 ===== */
function showDetail(title, rows, kind) {
  var box = document.getElementById('detail');
  box.dataset.kind = kind || '';
  document.getElementById('detailTitle').textContent = title;
  var ul = document.getElementById('detailList'); ul.textContent = '';
  if (!rows || !rows.length) { var li0 = document.createElement('li'); li0.textContent = '내용 없음'; ul.appendChild(li0); }
  rows.forEach(function(r) {
    var li = document.createElement('li'); if (r.main) li.className = 'main';
    if (r.k) { var b = document.createElement('b'); b.textContent = r.k + ' '; li.appendChild(b); }
    li.appendChild(document.createTextNode(String(r.t)));
    ul.appendChild(li);
  });
  box.classList.add('on');
}
function hideDetail() { document.getElementById('detail').classList.remove('on'); }
document.addEventListener('click', function(e) { if (document.getElementById('detail').classList.contains('on') && !e.target.closest('#detail')) hideDetail(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { hideDetail(); document.getElementById('wx').open = false; } });

function bindDetail(id, fn) {
  var el = document.getElementById(id);
  el.onclick = function(e) { e.stopPropagation(); if (document.getElementById('detail').classList.contains('on')) { hideDetail(); return; } fn(); };
  el.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.onclick(e); } };
}
bindDetail('mealRow', function() {
  var rows = (MEAL && MEAL.hasMeal) ? MEAL.dishes.map(function(x) { return { t: x }; }) : [{ t: document.getElementById('dishes').textContent }];
  if (MEAL && MEAL.kcal) rows.push({ k: '열량', t: MEAL.kcal });
  showDetail(((MEAL && MEAL.label) || '급식') + (MEAL && MEAL.date ? ' · ' + MEAL.date : ''), rows, 'meal');
});
bindDetail('tkLeft', function() {
  var items = (lastQ && lastQ.items) ? lastQ.items.filter(function(x){ return x && x.t && !(x.until && Date.parse(x.until) < Date.now()); }) : [];
  showDetail('큐 알림' + (lastQ && lastQ.at ? ' · ' + lastQ.at : ''), items.map(function(x) { return { k: x.k, t: x.t }; }), 'ticker');
});
bindDetail('tkRight', function() {
  showDetail('다음 일정', [{ k: document.getElementById('nxTime').textContent, t: document.getElementById('nxTitle').textContent }], 'next');
});

/* 기준 640×264보다 큰 창(예: Xeneon Edge 2560×720)은 같은 배치를 비율대로 키운다. 작은 창은 그대로 둔다. */
function fitZoom() {
  var k = Math.min(window.innerWidth / 640, window.innerHeight / 264);
  document.documentElement.style.zoom = k > 1 ? String(Math.floor(k * 100) / 100) : '';
}
/* 창이 넉넉하면(확대 뒤 높이 320px 이상) 달력에 행사 제목 한 줄을 더 보인다 */
function fitMode() {
  fitZoom();
  var z = parseFloat(document.documentElement.style.zoom) || 1;
  document.body.classList.toggle('tall', window.innerHeight / z >= 320);
}
window.addEventListener('resize', fitMode);
fitMode();

tick();
setInterval(tick, 1000);
load();
setInterval(load, 60000);
</script>
