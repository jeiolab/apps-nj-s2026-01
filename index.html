<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학사일정</title>
<style>
  /* 2026-09-28 큐 v3: 세 행(본문 / 급식 / 큐알림 자막). 기준 640×264, 모든 치수 border-box.
     왼쪽 패널은 시계 → 날짜 → 날씨 → 수업 순서로 한 중심선에 가운데 정렬. 달력은 날짜 아래 일정 제목 한 줄을 항상 보인다.
     기존 시계·수업·전체화면 알림·급식·날씨·달력·JSONP 1분 갱신 로직은 그대로다. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; }
  body {
    background:#0b0d10; color:#f2f2f2;
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
    display:grid;
    grid-template-rows:minmax(0,1fr) 22px 20px;
    gap:5px;
    padding:8px;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    font-variant-numeric:tabular-nums;
  }

  /* ---- 1행: 왼쪽 패널 + 달력 ---- */
  #main { display:grid; grid-template-columns:192px minmax(0,1fr); gap:8px; min-height:0; min-width:0; }
  #left { min-width:0; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; text-align:center; padding-top:2px; }
  #left > * { width:100%; }
  #g1 { display:flex; flex-direction:column; align-items:center; gap:1px; }           /* 시계 + 날짜: 아주 약한 간격 */
  #wx { margin-top:8px; }                                                                /* 날짜 → 날씨: 조금 띄움 */
  #class { margin-top:auto !important; }                                                 /* 날씨 → 수업: 남는 높이만큼 분명히 끊고, 카드 바닥이 달력 바닥과 맞는다(최소 12px는 아래 min 규칙) */
  #g2 { display:flex; flex-direction:column; align-items:center; padding-bottom:8px; }   /* 날씨 묶음 아래 최소 간격 */

  /* 시계·날짜: 묶음 전체를 가운데, 초는 작게. 분·초가 바뀌어도 폭이 같도록 숫자 폭 고정 */
  #clock { display:flex; align-items:baseline; justify-content:center; line-height:1; gap:4px; }
  #hm  { font-size:42px; font-weight:700; letter-spacing:-1px; }
  #sec { font-size:13px; font-weight:500; color:#8b949e; width:2ch; text-align:left; }
  #dateLine { font-size:13px; color:#a0a6ad; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 날씨: 날짜 바로 아래(상단 여백 0). 아이콘·온도·지역 한 줄, 그 아래 최저·최고 한 줄. 눌러 펼치면 일출·일몰·풍속 */
  #wx { position:relative; min-width:0; }
  #wx summary { list-style:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; min-width:0; outline:none; border-radius:6px; padding:0 4px; }
  #wx summary::-webkit-details-marker { display:none; }
  #wx summary:focus-visible { box-shadow:0 0 0 2px #58a6ff66; }
  #wxLine { display:flex; align-items:center; justify-content:center; gap:6px; line-height:1; min-width:0; padding:2px 0; }
  #wxIcon { color:#f2a33c; display:flex; align-items:center; flex:none; }
  #wxIcon svg { width:22px; height:22px; }
  #wxTemp { font-size:20px; font-weight:700; line-height:1; flex:none; }
  #wxTemp small { font-size:11px; font-weight:500; margin-left:1px; }
  #wxName { font-size:13px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #wxRange { font-size:11px; color:#a0a6ad; line-height:1.5; white-space:nowrap; }
  #wxMore { position:absolute; left:0; right:0; top:100%; z-index:5; font-size:11px; color:#e6edf3; background:#161b22; border:1px solid #30363d; border-radius:6px; padding:4px 6px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; box-shadow:0 6px 16px #0008; }   /* 배치를 밀지 않는 떠 있는 상자 */
  #wxMore span { display:inline-flex; align-items:center; gap:3px; }

  /* 수업: 날씨 아래 최소 간격. 상태 / 교시·반 / 남은 시간 위계 */
  #class {
    padding:5px 8px 6px; border-radius:6px; width:100%;
    background:#161b22; border:1px solid #21262d;
    display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0;
    transition:background .4s, border-color .4s;
  }
  #class.now  { border-color:#2ea04366; background:#1b2a1f; }
  #class.soon { border-color:#e8912d88; background:#2a2115; animation:blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { background:#3a2b12; } }
  #classState { font-size:11px; color:#8b949e; letter-spacing:.5px; line-height:1.4; }
  #class.now  #classState { color:#3fb950; }
  #class.soon #classState { color:#ffb45c; }
  #classMain { font-size:19px; font-weight:700; color:#fff; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  #classTime { font-size:12px; color:#8b949e; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* 달력: 머리(18px) + 요일(12px) + 6주. 칸마다 날짜 위, 일정 제목 아래(항상 한 줄) */
  #cal { min-width:0; min-height:0; display:flex; flex-direction:column; }
  #calHead { display:flex; align-items:center; justify-content:center; gap:6px; height:18px; flex:none; }
  #monthTitle { font-size:13px; font-weight:600; letter-spacing:-.2px; min-width:90px; text-align:center; }
  .nav { width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:15px; color:#8b949e; cursor:pointer; border-radius:4px; border:0; background:transparent; }
  .nav:hover, .nav:focus-visible { background:#ffffff14; color:#fff; outline:none; }
  #grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); grid-template-rows:12px repeat(6, minmax(0,1fr)); gap:0 2px; margin-top:2px; }
  .dow { font-size:10px; color:#8b949e; text-align:center; line-height:12px; }
  .dow.sun, .cell.sun .dnum { color:#e8912d; }
  .dow.sat, .cell.sat .dnum { color:#e8912d; }
  .cell { min-width:0; min-height:0; border-radius:3px; padding:1px 2px 0; gap:1px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; cursor:default; border:1px solid transparent; }
  .cell.has { cursor:pointer; }
  .cell.has:hover, .cell:focus-visible { background:#ffffff0d; outline:none; }
  .cell.today { background:#e8912d1f; border-color:#e8912d66; }
  .cell.other .dnum { color:#4a4f56 !important; }
  .cell.other .evline { color:#5a6068; }
  .dnum { font-size:11px; font-weight:600; line-height:12px; flex:none; }
  .evline { font-size:9px; color:#7ee787; line-height:10px; width:100%; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none; }
  .evline.main { color:#ffa657; }
  .evline .more { color:#8b949e; }
  .evline2 { display:none; }
  /* 창이 넉넉할 때: 320px 이상이면 글자를 조금 키우고, 400px 이상이면 둘째 일정 줄도 보인다(칸 높이가 세 줄을 담을 때만) */
  body.tall .dnum { font-size:13px; line-height:15px; }
  body.tall .evline { font-size:10px; line-height:12px; }
  body.tall2 .evline2 { display:block; }
  body.tall #grid { grid-template-rows:14px repeat(6, minmax(0,1fr)); }

  /* ---- 2행: 급식 — 얇은 보조 바(22px). 메뉴 본문 9px → 8px, 라벨 12px → 11px ---- */
  #mealRow { min-width:0; height:22px; display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:5px; background:#11151a; border:1px solid #1c2128; cursor:pointer; }
  #mealRow:focus-visible { outline:none; box-shadow:0 0 0 2px #58a6ff66; }
  #mealLabel { flex:none; font-size:11px; font-weight:600; color:#e8912d; line-height:1; }
  #dishes { flex:1; min-width:0; font-size:8px; line-height:1; color:#e6edf3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dishes.muted { color:#6e7681; }
  #kcal { flex:none; font-size:8px; line-height:1; color:#6e7681; white-space:nowrap; }

  /* ---- 3행: [큐알림 라벨][흐르는 본문][다음 일정] ---- */
  #ticker { min-width:0; height:20px; display:grid; grid-template-columns:auto minmax(0,1fr) fit-content(40%); align-items:center; gap:8px; padding:0 8px; border-radius:5px; background:#11151a; border:1px solid #1c2128; }
  #tkTag { flex:none; font-size:10px; font-weight:700; color:#f85149; letter-spacing:.5px; white-space:nowrap; line-height:1; }
  #tkRun { min-width:0; height:100%; overflow:hidden; position:relative; cursor:pointer; outline:none; }
  #tkRun:focus-visible { box-shadow:0 0 0 2px #58a6ff66; border-radius:4px; }
  #tkTrack { position:absolute; top:0; left:0; height:100%; display:flex; align-items:center; white-space:nowrap; font-size:11px; color:#e6edf3; will-change:transform; }
  #tkTrack b { color:#ffa657; font-weight:600; }
  #tkTrack .sep { color:#6e7681; margin:0 10px; }
  #tkTrack.roll { animation:roll var(--dur, 20s) linear infinite; }
  @keyframes roll { from { transform:translateX(var(--from, 0px)); } to { transform:translateX(var(--to, -100%)); } }
  #tkRun:hover #tkTrack, #tkRun:focus-visible #tkTrack, #ticker.paused #tkTrack { animation-play-state:paused; }
  #tkTrack.still { position:static; overflow:hidden; text-overflow:ellipsis; display:block; line-height:18px; }   /* 동작 줄이기 또는 알림 없음: 멈춘 한 줄 */
  #tkTrack.muted { color:#6e7681; }
  @media (prefers-reduced-motion: reduce) { #tkTrack.roll { animation:none; } }
  #tkRight { min-width:0; width:100%; display:flex; align-items:center; gap:5px; cursor:pointer; overflow:hidden; }
  #tkRight.hide { display:none; }
  #tkRight:focus-visible { outline:none; box-shadow:0 0 0 2px #58a6ff66; border-radius:4px; }
  #nxLabel { flex:none; font-size:10px; color:#8b949e; }
  #nxTime { flex:none; font-size:11px; font-weight:700; color:#ffa657; }
  #nxTitle { min-width:0; font-size:11px; color:#e6edf3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- 상세 보기 (한 개, 창 안에서만) ---- */
  #detail { position:fixed; left:8px; right:8px; bottom:8px; z-index:900; display:none; max-height:calc(100% - 16px); overflow:auto; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 10px; box-shadow:0 8px 24px #000a; }
  #detail.on { display:block; }
  #detail h4 { font-size:12px; color:#8b949e; font-weight:600; margin-bottom:4px; display:flex; justify-content:space-between; gap:8px; }
  #detail h4 span:last-child { color:#6e7681; font-weight:400; white-space:nowrap; }
  #detail ul { list-style:none; }
  #detail li { font-size:13px; color:#e6edf3; line-height:1.45; overflow-wrap:anywhere; }
  #detail li b { color:#ffa657; font-weight:600; }
  #detail li.main { color:#ffa657; }

  /* ---- 전체화면 알림 (기존) ---- */
  #alert { position:fixed; inset:0; z-index:999; display:none; flex-direction:column; align-items:center; justify-content:center; background:#e8912d; color:#1a1200; cursor:pointer; }
  #alert.on { display:flex; animation:flash 1s steps(1,end) infinite; }
  @keyframes flash { 0%,49% { background:#e8912d; color:#1a1200; } 50%,100% { background:#1a1200; color:#e8912d; } }
  #alertTop  { font-size:min(44px, 8vh); font-weight:600; letter-spacing:6px; }
  #alertMain { font-size:min(190px, 40vh); font-weight:800; line-height:1; letter-spacing:-6px; }
  #alertSub  { font-size:min(40px, 8vh); font-weight:500; margin-top:6px; }
  #alertHint { position:absolute; bottom:12px; font-size:min(18px, 4vh); opacity:.7; }

  #err { position:fixed; top:4px; right:8px; font-size:10px; color:#f85149; }
</style>
</head>
<body>

<div id="main">
  <div id="left">
    <div id="g1">
      <div id="clock"><span id="hm">--:--</span><span id="sec">--</span></div>
      <div id="dateLine">----------</div>
    </div>

    <div id="g2">
    <details id="wx">
      <summary title="일출·일몰·풍속 보기">
        <div id="wxLine">
          <div id="wxIcon"></div>
          <div id="wxTemp">--<small>°C</small></div>
          <div id="wxName">--</div>
        </div>
        <div id="wxRange">최저 <span id="tmin">--</span>° · 최고 <span id="tmax">--</span>°</div>
      </summary>
      <div id="wxMore">
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 18h18M12 3v6M8 9l4-4 4 4M5 14l1 1M19 14l-1 1"/></svg>일출 <span id="sunrise">--:--</span></span>
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 18h18M12 9V3M8 5l4 4 4-4M5 14l1 1M19 14l-1 1"/></svg>일몰 <span id="sunset">--:--</span></span>
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h9"/></svg>바람 <span id="wind">--</span> km/h</span>
      </div>
    </details>
    </div>

    <div id="class">
      <span id="classState">수업</span>
      <span id="classMain">—</span>
      <span id="classTime"></span>
    </div>
  </div>

  <div id="cal">
    <div id="calHead">
      <button class="nav" type="button" onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
      <div id="monthTitle">—</div>
      <button class="nav" type="button" onclick="moveMonth(1)" aria-label="다음 달">›</button>
    </div>
    <div id="grid" role="grid" aria-label="월간 달력"></div>
  </div>
</div>

<div id="mealRow" tabindex="0" role="button" aria-label="급식 전체 보기">
  <span id="mealLabel">급식</span>
  <span id="dishes" class="muted">불러오는 중…</span>
  <span id="kcal"></span>
</div>

<div id="ticker">
  <span id="tkTag">큐알림</span>
  <div id="tkRun" tabindex="0" role="button" aria-label="알림 전체 보기"><div id="tkTrack" class="still muted">알림 없음</div></div>
  <div id="tkRight" class="hide" tabindex="0" role="button" aria-label="다음 일정 전체 보기">
    <span id="nxLabel">다음</span>
    <span id="nxTime"></span>
    <span id="nxTitle"></span>
  </div>
</div>

<div id="detail" role="dialog" aria-live="polite"><h4><span id="detailTitle"></span><span>창 밖을 누르거나 Esc로 닫기</span></h4><ul id="detailList"></ul></div>

<div id="alert" onclick="closeAlert()">
  <div id="alertTop">수업 시작</div>
  <div id="alertMain">—</div>
  <div id="alertSub"></div>
  <div id="alertHint">화면을 터치하면 닫힙니다</div>
</div>

<div id="err"></div>

<script>
/* ===== Apps Script 주소 ===== */
var API = 'https://script.google.com/macros/s/AKfycbxXYMueYS6ex0eoF3Xp1-WkDOvdSW6j9sYJeEbQ8gAN74ZEScEc-Fp8lm69J2OwtEzg0A/exec';

/* ===== 알림 설정 ===== */
var ALERT_SECONDS = 15;   // 전체화면 알림 표시 시간
var TICKER_SPEED  = 40;   // 자막 이동 속도 (px/초). 이 값 하나로 빠르기를 조절한다

var DATA = null, viewY = null, viewM = null, lastNav = 0, cbSeq = 0;
var firedKey = null, alertTimer = null;
var DOW = ['일', '월', '화', '수', '목', '금', '토'];

/* ===== 데이터 (JSONP) — 기존 그대로 ===== */
function load() {
  var name = 'cb' + (++cbSeq);
  var s = document.createElement('script');
  var done = false;

  window[name] = function(d) {
    done = true;
    document.getElementById('err').textContent = '';
    onData(d);
    delete window[name];
    if (s.parentNode) s.parentNode.removeChild(s);
  };

  s.src = API + '?callback=' + name + '&t=' + Date.now();
  s.onerror = function() {
    document.getElementById('err').textContent = '데이터 연결 실패';
    delete window[name];
    if (!DATA) { setMealState('급식을 불러오지 못했습니다'); }
  };
  document.head.appendChild(s);

  setTimeout(function() {
    if (!done) document.getElementById('err').textContent = '응답 지연';
  }, 15000);
}

function onData(d) {
  DATA = d;
  var t = d.today.split('-');
  if (viewY === null || Date.now() - lastNav > 120000) {
    viewY = +t[0]; viewM = +t[1];
  }
  renderMeal(d.meal);
  renderWeather(d.weather);
  drawCalendar();
  renderClass(new Date());
  renderTicker(d.q);
}

/* ===== 시계 (계산은 기존 그대로, 표기만 「9월 28일 월요일」) ===== */
function tick() {
  var n = new Date();
  document.getElementById('hm').textContent = p(n.getHours()) + ':' + p(n.getMinutes());
  document.getElementById('sec').textContent = p(n.getSeconds());
  document.getElementById('dateLine').textContent =
    (n.getMonth() + 1) + '월 ' + n.getDate() + '일 ' + DOW[n.getDay()] + '요일';
  renderClass(n);
}
function p(n) { return (n < 10 ? '0' : '') + n; }

function toMin(hhmm) {
  var a = hhmm.split(':');
  return (+a[0]) * 60 + (+a[1]);
}

/* ===== 수업 — 기존 로직 그대로 ===== */
function todayList(n) {
  var rows = DATA.timetable[n.getDay()];
  if (!rows) return [];
  var list = [];
  for (var i = 0; i < DATA.periods.length; i++) {
    if (rows[i] === null || rows[i] === undefined) continue;
    list.push({
      no: DATA.periods[i].no, cls: rows[i],
      s: toMin(DATA.periods[i].start), e: toMin(DATA.periods[i].end),
      stext: DATA.periods[i].start, etext: DATA.periods[i].end
    });
  }
  return list;
}

function setText(id, v) { var el = document.getElementById(id); if (el.textContent !== v) el.textContent = v; }   // 같은 값이면 건드리지 않는다(떨림 방지)

function renderClass(n) {
  if (!DATA) return;

  var box = document.getElementById('class');
  var list = todayList(n);
  var cls = '', st, mn, tm;
  if (list.length === 0) { st = '수업'; mn = '없음'; tm = ''; }
  else {
    var nowMin = n.getHours() * 60 + n.getMinutes();
    var found = false;
    // 수업 중
    for (var j = 0; j < list.length && !found; j++) {
      if (nowMin >= list[j].s && nowMin < list[j].e) {
        cls = 'now'; st = '수업 중';
        mn = list[j].no + '교시 · ' + list[j].cls + '반';
        tm = '종료까지 ' + (list[j].e - nowMin) + '분';
        if (nowMin === list[j].s) tryAlert(n, list[j]);   // 시작 직후 1분 안이면 전체화면 알림
        found = true;
      }
    }
    // 다음 수업
    for (var k = 0; k < list.length && !found; k++) {
      if (list[k].s > nowMin) {
        var left = list[k].s - nowMin;
        if (left <= DATA.alertMin) { cls = 'soon'; st = left + '분 후 시작'; }
        else { st = '다음 수업'; }
        mn = list[k].no + '교시 · ' + list[k].cls + '반';
        tm = list[k].stext + ' – ' + list[k].etext;
        found = true;
      }
    }
    if (!found) { st = '오늘 수업'; mn = '종료'; tm = ''; }
  }
  if (box.className !== cls) box.className = cls;
  setText('classState', st); setText('classMain', mn); setText('classTime', tm);
}

/* ===== 전체화면 알림 — 기존 그대로 ===== */
function tryAlert(n, item) {
  var key = n.toDateString() + '_' + item.no;
  if (firedKey === key) return;      // 같은 교시는 한 번만
  firedKey = key;

  document.getElementById('alertMain').textContent = item.cls + '반';
  document.getElementById('alertSub').textContent =
    item.no + '교시  ·  ' + item.stext + ' - ' + item.etext;
  document.getElementById('alert').classList.add('on');

  clearTimeout(alertTimer);
  alertTimer = setTimeout(closeAlert, ALERT_SECONDS * 1000);
}

function closeAlert() {
  clearTimeout(alertTimer);
  document.getElementById('alert').classList.remove('on');
}

/* ===== 급식: 한 줄 요약 + 상세 보기 ===== */
var MEAL = null;
function setMealState(text) {
  var el = document.getElementById('dishes');
  el.textContent = text; el.className = 'muted'; el.title = '';
  document.getElementById('kcal').textContent = '';
}
function renderMeal(m) {
  MEAL = m || null;
  document.getElementById('mealLabel').textContent = (m && m.label) || '급식';
  if (!m) { setMealState('급식 정보 없음'); return; }
  if (!m.hasMeal) { setMealState('급식 없음'); return; }
  var el = document.getElementById('dishes');
  el.textContent = m.dishes.join(' · ');
  el.className = '';
  el.title = m.dishes.join(', ');
  document.getElementById('kcal').textContent = m.kcal || '';
}

/* ===== 날씨: 한 줄(아이콘·온도·지역) + 최저·최고, 펼치면 일출·일몰·풍속 ===== */
function renderWeather(w) {
  if (!w || !w.ok) {
    document.getElementById('wxName').textContent = w ? w.name : '--';
    return;
  }
  document.getElementById('wxTemp').innerHTML = w.temp + '<small>°C</small>';
  document.getElementById('wxName').textContent = w.name;
  document.getElementById('tmin').textContent = w.tmin;
  document.getElementById('tmax').textContent = w.tmax;
  document.getElementById('wind').textContent = w.wind;
  document.getElementById('sunrise').textContent = w.sunrise;
  document.getElementById('sunset').textContent = w.sunset;
  document.getElementById('wxIcon').innerHTML = iconFor(w.code);
}

function iconFor(c) {
  var S = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"';
  if (c === 0 || c === 1)
    return '<svg ' + S + '><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>';
  if (c === 2 || c === 3)
    return '<svg ' + S + '><circle cx="8.5" cy="8.5" r="3.2"/><path d="M17 19H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 19z"/></svg>';
  if (c >= 45 && c <= 48)
    return '<svg ' + S + '><path d="M3 8h18M3 12h18M3 16h13M3 20h9"/></svg>';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82))
    return '<svg ' + S + '><path d="M17 15H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 15z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></svg>';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86)
    return '<svg ' + S + '><path d="M17 14H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 14z"/><path d="M9 18h.01M13 19h.01M17 18h.01"/></svg>';
  if (c >= 95)
    return '<svg ' + S + '><path d="M17 13H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 13z"/><path d="M13 15l-3 4h4l-3 4"/></svg>';
  return '<svg ' + S + '><path d="M17 18H8a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.3 3.3 0 0 1 17 18z"/></svg>';
}

/* ===== 달력: 날짜 아래 일정 제목 한 줄(항상), 누르거나 Enter로 그날 일정 전체 ===== */
function moveMonth(delta) {
  lastNav = Date.now();
  viewM += delta;
  if (viewM < 1)  { viewM = 12; viewY--; }
  if (viewM > 12) { viewM = 1;  viewY++; }
  drawCalendar();
}

function drawCalendar() {
  if (!DATA) return;
  document.getElementById('monthTitle').textContent = viewY + '년 ' + viewM + '월';

  var first = new Date(viewY, viewM - 1, 1).getDay();
  var last  = new Date(viewY, viewM, 0).getDate();
  var prevLast = new Date(viewY, viewM - 1, 0).getDate();
  var grid = document.getElementById('grid');
  grid.textContent = '';

  for (var h = 0; h < 7; h++) {
    var dow = document.createElement('div');
    dow.className = 'dow' + (h === 0 ? ' sun' : (h === 6 ? ' sat' : ''));
    dow.textContent = DOW[h];
    grid.appendChild(dow);
  }

  var day = 1, nextDay = 1;
  for (var w = 0; w < 6; w++) {
    for (var c = 0; c < 7; c++) {
      var cell = document.createElement('div');
      var cls = 'cell' + (c === 0 ? ' sun' : (c === 6 ? ' sat' : ''));
      var num, ds = null;
      if (w === 0 && c < first) { num = prevLast - first + c + 1; cls += ' other'; }
      else if (day > last)      { num = nextDay++; cls += ' other'; }
      else {
        num = day;
        ds = viewY + '-' + p(viewM) + '-' + p(day);
        if (ds === DATA.today) cls += ' today';
        day++;
      }
      var dn = document.createElement('span'); dn.className = 'dnum'; dn.textContent = num; cell.appendChild(dn);
      var items = ds ? (DATA.eventMap[ds] || []) : [];
      if (items.length) {
        cls += ' has';
        // 첫 일정 제목(원문 앞부분이 보이게 말줄임). 둘 이상이면 " +n"을 뒤에 붙이되 제목이 밀리면 브라우저가 뒤쪽(+n)부터 자른다
        var ev = document.createElement('div'); ev.className = 'evline' + (items[0].type === '주요행사' ? ' main' : '');
        ev.appendChild(document.createTextNode(items[0].text));
        if (items.length > 1) { var more = document.createElement('span'); more.className = 'more'; more.textContent = ' +' + (items.length - 1); ev.appendChild(more); }
        cell.appendChild(ev);
        if (items.length > 1) {   // 창이 넉넉할 때만 보이는 둘째 줄
          var ev2 = document.createElement('div'); ev2.className = 'evline evline2' + (items[1].type === '주요행사' ? ' main' : ''); ev2.textContent = items[1].text; cell.appendChild(ev2);
        }
        cell.title = items.map(function(i) { return '[' + i.type + '] ' + i.text; }).join('\n');
        cell.tabIndex = 0;
        cell.setAttribute('role', 'button');
        cell.setAttribute('aria-label', viewM + '월 ' + num + '일 일정 ' + items.length + '건');
        (function(cell, ds, items) {   // 반복문의 var cell 은 마지막 칸을 가리키므로 인자로 묶는다
          cell.onclick = function(e) { e.stopPropagation(); showDetail(ds.replace(/^\d+-0?(\d+)-0?(\d+)$/, '$1월 $2일') + ' 일정', items.map(function(i) { return { k: i.type, t: i.text, main: i.type === '주요행사' }; }), 'cal'); };
          cell.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cell.onclick(e); } };
        })(cell, ds, items);
      }
      cell.className = cls;
      grid.appendChild(cell);
    }
  }
}

/* ===== 3행: [큐알림][흐르는 본문][다음 일정]. 앱스 스크립트가 q:{at, items:[{k,t,until}]}를 실어 준다 =====
   자막은 자료가 실제로 바뀔 때만 다시 만든다(시계의 매초 갱신과 무관). 이동 시간은 글 길이로 계산(TICKER_SPEED px/초). */
var lastQ = null, lastKey = null, tickerItems = [];
function liveItems(q) {
  var now = Date.now();
  return (q && q.items) ? q.items.filter(function(x){ return x && x.t && !(x.until && Date.parse(x.until) < now); }) : [];
}
function renderTicker(q) {
  lastQ = q;
  var items = liveItems(q);
  var sig = items.map(function(x){ return (x.k || '') + '|' + x.t; }).join('\n');
  if (sig === lastKey) return;
  lastKey = sig;
  var dbox = document.getElementById('detail');
  if (dbox.classList.contains('on') && (dbox.dataset.kind === 'ticker' || dbox.dataset.kind === 'next')) hideDetail();   // 알림이 바뀌면 알림·다음 일정 상세만 닫는다

  var next = null, rest = [];
  items.forEach(function(x) {
    var m = /^다음\s+(\d\d:\d\d)$/.exec(x.k || '');
    if (m && !next) next = { time: m[1], t: x.t }; else rest.push(x);
  });
  tickerItems = rest;

  var right = document.getElementById('tkRight');
  if (next) {
    right.classList.remove('hide');
    document.getElementById('nxTime').textContent = next.time;
    document.getElementById('nxTitle').textContent = next.t;
    right.title = next.time + ' ' + next.t;
  } else { right.classList.add('hide'); right.title = ''; }

  var track = document.getElementById('tkTrack');
  track.style.animation = '';
  track.textContent = '';
  if (!rest.length) {
    track.className = 'still muted'; track.textContent = next ? '' : '알림 없음';
    document.getElementById('tkRun').title = '';
    return;
  }
  rest.forEach(function(x, i) {
    if (i) { var sp = document.createElement('span'); sp.className = 'sep'; sp.textContent = '·'; track.appendChild(sp); }
    if (x.k) { var b = document.createElement('b'); b.textContent = x.k + ' '; track.appendChild(b); }
    track.appendChild(document.createTextNode(String(x.t)));
  });
  document.getElementById('tkRun').title = rest.map(function(x) { return (x.k ? x.k + ' ' : '') + x.t; }).join('\n');
  layoutTicker();
}
/* 표시창 너비와 글 너비로 이동 거리·시간을 정한다. 창 크기가 바뀌면 다시 계산 */
function layoutTicker() {
  var track = document.getElementById('tkTrack'), run = document.getElementById('tkRun');
  if (!tickerItems.length) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { track.className = 'still'; return; }   // 동작 줄이기: 멈춘 한 줄(말줄임) + 상세 보기
  track.className = '';
  var W = run.clientWidth, T = track.scrollWidth;
  var dist = W + T;   // 오른쪽 끝에서 나타나 왼쪽 끝으로 완전히 사라진다
  track.style.setProperty('--from', W + 'px');
  track.style.setProperty('--to', (-T) + 'px');
  track.style.setProperty('--dur', (dist / TICKER_SPEED).toFixed(2) + 's');
  track.className = 'roll';
}
var resizeTimer = null;
window.addEventListener('resize', function() { clearTimeout(resizeTimer); resizeTimer = setTimeout(function() { fitMode(); layoutTicker(); }, 150); });
if (window.matchMedia) {   // 운영체제의 「동작 줄이기」를 켜고 끄면 그 자리에서 자막을 멈추거나 다시 흘린다 (강희 지적)
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (mq.addEventListener) mq.addEventListener('change', layoutTicker); else if (mq.addListener) mq.addListener(layoutTicker);
}
setInterval(function(){ if (lastQ) renderTicker(lastQ); }, 60000);   // 분마다 지난 줄을 걸러낸다(내용이 같으면 자막은 그대로 흐른다)

/* ===== 상세 보기 ===== */
function showDetail(title, rows, kind) {
  var box = document.getElementById('detail');
  box.dataset.kind = kind || '';
  document.getElementById('detailTitle').textContent = title;
  var ul = document.getElementById('detailList'); ul.textContent = '';
  if (!rows || !rows.length) { var li0 = document.createElement('li'); li0.textContent = '내용 없음'; ul.appendChild(li0); }
  rows.forEach(function(r) {
    var li = document.createElement('li'); if (r.main) li.className = 'main';
    if (r.k) { var b = document.createElement('b'); b.textContent = r.k + ' '; li.appendChild(b); }
    li.appendChild(document.createTextNode(String(r.t)));
    ul.appendChild(li);
  });
  box.classList.add('on');
  document.getElementById('ticker').classList.add('paused');   // 상세를 읽는 동안 자막은 멈춘다
}
function hideDetail() { document.getElementById('detail').classList.remove('on'); document.getElementById('ticker').classList.remove('paused'); }
document.addEventListener('click', function(e) { if (document.getElementById('detail').classList.contains('on') && !e.target.closest('#detail')) hideDetail(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { hideDetail(); document.getElementById('wx').open = false; } });

function bindDetail(id, fn) {
  var el = document.getElementById(id);
  el.onclick = function(e) { e.stopPropagation(); if (document.getElementById('detail').classList.contains('on')) { hideDetail(); return; } fn(); };
  el.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.onclick(e); } };
}
bindDetail('mealRow', function() {
  var rows = (MEAL && MEAL.hasMeal) ? MEAL.dishes.map(function(x) { return { t: x }; }) : [{ t: document.getElementById('dishes').textContent }];
  if (MEAL && MEAL.kcal) rows.push({ k: '열량', t: MEAL.kcal });
  showDetail(((MEAL && MEAL.label) || '급식') + (MEAL && MEAL.date ? ' · ' + MEAL.date : ''), rows, 'meal');
});
bindDetail('tkRun', function() {
  var items = liveItems(lastQ);
  showDetail('큐알림' + (lastQ && lastQ.at ? ' · ' + lastQ.at : ''), items.map(function(x) { return { k: x.k, t: x.t }; }), 'ticker');
});
bindDetail('tkRight', function() {
  showDetail('다음 일정', [{ k: document.getElementById('nxTime').textContent, t: document.getElementById('nxTitle').textContent }], 'next');
});

/* 기준 640×264보다 큰 창(예: Xeneon Edge 2560×720)은 같은 배치를 비율대로 키운다. 작은 창은 그대로 둔다. */
function fitZoom() {
  var k = Math.min(window.innerWidth / 640, window.innerHeight / 264);
  document.documentElement.style.zoom = k > 1 ? String(Math.floor(k * 100) / 100) : '';
}
/* 확대 뒤 높이가 320px 이상이면 달력 글자를 키우고, 400px 이상이면 둘째 일정 줄도 보인다 */
function fitMode() {
  fitZoom();
  var z = parseFloat(document.documentElement.style.zoom) || 1;
  var h = window.innerHeight / z;
  document.body.classList.toggle('tall', h >= 320);
  document.body.classList.toggle('tall2', h >= 400);
}
fitMode();

tick();
setInterval(tick, 1000);
load();
setInterval(load, 60000);
</script>
