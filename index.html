<!DOCTYPE html>
<html lang="ko">
<!-- 2026-09-29 v7: 큐알림 자동 순환 및 장시간 실행 안정화. API 주소와 본문 배치는 유지. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학사일정</title>
<style>
  /* 2026-09-28 큐 v3: 세 행(본문 / 급식 / 큐알림 자막). 기준 640×264, 모든 치수 border-box.
     왼쪽 패널은 시계 → 날짜 → 날씨 → 수업 순서로 한 중심선에 가운데 정렬. 달력은 날짜 아래 일정 제목 한 줄을 항상 보인다.
     v7: 화면 배치는 유지하고 자막·데이터 갱신·입력 검증 로직을 보강했다. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; }
  body {
    background:#0b0d10; color:#f2f2f2;
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
    overflow:hidden; position:relative;
    -webkit-user-select:none; user-select:none;
    font-variant-numeric:tabular-nums;
  }
  /* 2026-09-29 v6: 배치(#stage)만 확대(zoom)하고 전체화면 알림(#alert)은 확대 밖에 둔다.
     전에는 문서 전체(html)에 zoom을 걸어, 화면에 고정된 알림 상자가 배율만큼 커져 Xeneon Edge에서 화면 밖으로 나갔다(캡틴 지적). */
  #stage {
    position:relative; width:100%; height:100%;
    display:grid;
    grid-template-rows:minmax(0,1fr) 18px 16px;
    gap:4px;
    padding:8px;
    overflow:hidden;
  }
  /* ---- 1행: 왼쪽 패널 + 달력 ---- */
  #main { display:grid; grid-template-columns:192px minmax(0,1fr); gap:8px; min-height:0; min-width:0; }
  #left { min-width:0; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:space-between; overflow:hidden; text-align:center; padding-top:2px; }
  #left > * { width:100%; }
  #g1 { display:flex; flex-direction:column; align-items:center; gap:1px; }           /* 시계 + 날짜: 아주 약한 간격 */
  #g2 { display:flex; flex-direction:column; align-items:center; }                    /* 날씨 묶음 — 위·아래 간격은 space-between 이 똑같이 나눈다 */
  /* 시계·날짜: 묶음 전체를 가운데, 초는 작게. 분·초가 바뀌어도 폭이 같도록 숫자 폭 고정 */
  #clock { display:flex; align-items:baseline; justify-content:center; line-height:1; gap:4px; }
  #hm  { font-size:42px; font-weight:700; letter-spacing:-1px; }
  #sec { font-size:13px; font-weight:500; color:#8b949e; width:2ch; text-align:left; }
  #dateLine { font-size:13px; color:#a0a6ad; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 날씨: 날짜 바로 아래(상단 여백 0). 아이콘·온도·지역 한 줄, 그 아래 최저·최고 한 줄. 눌러 펼치면 일출·일몰·풍속 */
  #wx { position:relative; min-width:0; }
  #wx summary { list-style:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; min-width:0; outline:none; border-radius:6px; padding:0 4px; }
  #wx summary::-webkit-details-marker { display:none; }
  #wx summary:focus-visible { box-shadow:0 0 0 2px #58a6ff66; }
  #wxLine { display:flex; align-items:center; justify-content:center; gap:6px; line-height:1; min-width:0; padding:2px 0; }
  #wxIcon { color:#f2a33c; display:flex; align-items:center; flex:none; }
  #wxIcon svg { width:22px; height:22px; }
  #wxTemp { font-size:20px; font-weight:700; line-height:1; flex:none; }
  #wxTemp small { font-size:11px; font-weight:500; margin-left:1px; }
  #wxName { font-size:13px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #wxRange { font-size:11px; color:#a0a6ad; line-height:1.5; white-space:nowrap; }
  #wxMore { position:absolute; left:0; right:0; top:100%; z-index:5; font-size:11px; color:#e6edf3; background:#161b22; border:1px solid #30363d; border-radius:6px; padding:4px 6px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; box-shadow:0 6px 16px #0008; }   /* 배치를 밀지 않는 떠 있는 상자 */
  #wxMore span { display:inline-flex; align-items:center; gap:3px; }
  /* 수업: 날씨 아래 최소 간격. 상태 / 교시·반 / 남은 시간 위계 */
  #class {
    padding:4px 8px 5px; border-radius:6px; width:100%;
    background:#161b22; border:1px solid #21262d;
    display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0;
    transition:background .4s, border-color .4s;
  }
  #class.now  { border-color:#2ea04366; background:#1b2a1f; }
  #class.soon { border-color:#e8912d88; background:#2a2115; animation:blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { background:#3a2b12; } }
  #classState { font-size:11px; color:#8b949e; letter-spacing:.5px; line-height:1.4; }
  #class.now  #classState { color:#3fb950; }
  #class.soon #classState { color:#ffb45c; }
  #classMain { font-size:19px; font-weight:700; color:#fff; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  #classTime { font-size:12px; color:#8b949e; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  /* 달력: 머리(18px) + 요일(12px) + 6주. 칸마다 날짜 위, 일정 제목 아래(항상 한 줄) */
  #cal { min-width:0; min-height:0; display:flex; flex-direction:column; }
  #calHead { display:flex; align-items:center; justify-content:center; gap:6px; height:18px; flex:none; }
  #monthTitle { font-size:13px; font-weight:600; letter-spacing:-.2px; min-width:90px; text-align:center; }
  .nav { width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:15px; color:#8b949e; cursor:pointer; border-radius:4px; border:0; background:transparent; }
  .nav:hover, .nav:focus-visible { background:#ffffff14; color:#fff; outline:none; }
  #grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); grid-template-rows:12px repeat(6, minmax(0,1fr)); gap:0 2px; margin-top:2px; }
  .dow { font-size:10px; color:#8b949e; text-align:center; line-height:12px; }
  .dow.sun, .cell.sun .dnum { color:#e8912d; }
  .dow.sat, .cell.sat .dnum { color:#e8912d; }
  .cell { min-width:0; min-height:0; border-radius:3px; padding:1px 2px 0; gap:1px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; cursor:default; border:1px solid transparent; }
  .cell.has { cursor:pointer; }
  .cell.has:hover, .cell:focus-visible { background:#ffffff0d; outline:none; }
  .cell.today { background:#e8912d1f; border-color:#e8912d66; }
  .cell.other .dnum { color:#4a4f56 !important; }
  .cell.other .evline { color:#5a6068; }
  .dnum { font-size:13px; font-weight:600; line-height:14px; flex:none; }
  .evline { font-size:7px; color:#7ee787; line-height:9px; width:100%; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none; }
  .evline.main { color:#ffa657; }
  .evline .more { color:#8b949e; }
  .evline2 { display:none; }
  /* 창이 넉넉할 때: 320px 이상이면 글자를 조금 키우고, 400px 이상이면 둘째 일정 줄도 보인다(칸 높이가 세 줄을 담을 때만) */
  body.tall .dnum { font-size:15px; line-height:17px; }
  body.tall .evline { font-size:8px; line-height:10px; }
  body.tall2 .evline2 { display:block; }
  body.tall #grid { grid-template-rows:14px repeat(6, minmax(0,1fr)); }
  /* ---- 2행: 급식 — 얇은 정보 바(18px). 메뉴 본문 8px → 6px, 라벨 11px → 9px ---- */
  #mealRow { min-width:0; height:18px; display:flex; align-items:center; gap:6px; padding:0 7px; border-radius:4px; background:#11151a; border:1px solid #1c2128; cursor:pointer; }
  #mealRow:focus-visible { outline:none; box-shadow:0 0 0 2px #58a6ff66; }
  #mealLabel { flex:none; font-size:9px; font-weight:600; color:#e8912d; line-height:1; }
  #dishes { flex:1; min-width:0; font-size:6px; line-height:1; color:#e6edf3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dishes.muted { color:#6e7681; }
  #kcal { flex:none; font-size:6px; line-height:1; color:#6e7681; white-space:nowrap; }
  /* ---- 3행: 큐알림 / 자동 순환 / 수동 일시정지 ---- */
  #ticker { min-width:0; height:16px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:6px; padding:0 7px; border-radius:4px; background:#11151a; border:1px solid #1c2128; }
  #tkTag { font-size:8px; font-weight:700; color:#f85149; letter-spacing:.5px; white-space:nowrap; line-height:1; }
  #tkRun { min-width:0; height:100%; overflow:hidden; position:relative; cursor:pointer; outline:none; }
  #tkRun:focus-visible { box-shadow:inset 0 0 0 1px #58a6ff; border-radius:3px; }
  #tkTrack { position:absolute; inset:0 auto 0 0; display:flex; align-items:center; width:max-content; height:100%; white-space:nowrap; font-size:9px; color:#e6edf3; transform:translate3d(0,0,0); }
  #tkTrack.moving { will-change:transform; }
  #tkTrack .tkGroup { display:block; flex:0 0 auto; width:max-content; white-space:nowrap; }
  #tkTrack b { color:#ffa657; font-weight:600; }
  #tkTrack .sep { display:inline-block; color:#6e7681; margin:0 10px; }
  #tkTrack.still { position:static; display:block; width:100%; overflow:hidden; text-overflow:ellipsis; line-height:14px; transform:none; }
  #tkTrack.muted { color:#6e7681; }
  #tkToggle { width:14px; height:14px; padding:0; border:0; border-radius:2px; background:transparent; color:#8b949e; font-size:9px; line-height:14px; cursor:pointer; }
  #tkToggle:hover, #tkToggle:focus-visible { color:#fff; background:#ffffff14; outline:none; }
  #tkToggle:disabled { cursor:default; opacity:.35; }
  /* 자막 모드는 JS 설정 한 곳에서만 결정한다. CSS와 JS가 서로 재생을 덮어쓰지 않는다. */

  /* ---- 상세 보기 (한 개, 창 안에서만) ---- */
  #detail { position:absolute; left:8px; right:8px; bottom:8px; z-index:900; display:none; max-height:calc(100% - 16px); overflow:auto; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 10px; box-shadow:0 8px 24px #000a; }
  #detail.on { display:block; }
  #detail h4 { font-size:12px; color:#8b949e; font-weight:600; margin-bottom:4px; display:flex; justify-content:space-between; gap:8px; }
  #detail h4 span:last-child { color:#6e7681; font-weight:400; white-space:nowrap; }
  #detail ul { list-style:none; }
  #detail li { font-size:13px; color:#e6edf3; line-height:1.45; overflow-wrap:anywhere; }
  #detail li b { color:#ffa657; font-weight:600; }
  #detail li.main { color:#ffa657; }
  /* ---- 전체화면 알림 (기존) ---- */
  #alert { position:fixed; inset:0; z-index:999; display:none; flex-direction:column; align-items:center; justify-content:center; background:#e8912d; color:#1a1200; cursor:pointer; }
  #alert.on { display:flex; animation:flash 1s steps(1,end) infinite; }
  @keyframes flash { 0%,49% { background:#e8912d; color:#1a1200; } 50%,100% { background:#1a1200; color:#e8912d; } }
  #alertTop  { font-size:9vh; font-weight:600; letter-spacing:.15em; }
  #alertMain { font-size:44vh; font-weight:800; line-height:1; letter-spacing:-.03em; }
  #alertSub  { font-size:8vh; font-weight:500; margin-top:1vh; }
  #alertHint { position:absolute; bottom:2vh; font-size:3.5vh; opacity:.7; }
  #err { position:fixed; top:4px; right:8px; font-size:10px; color:#f85149; }
</style>
</head>
<body>
<div id="stage">
<div id="main">
  <div id="left">
    <div id="g1">
      <div id="clock"><span id="hm">--:--</span><span id="sec">--</span></div>
      <div id="dateLine">----------</div>
    </div>
    <div id="g2">
    <details id="wx">
      <summary title="일출·일몰·풍속 보기">
        <div id="wxLine">
          <div id="wxIcon"></div>
          <div id="wxTemp">--<small>°C</small></div>
          <div id="wxName">--</div>
        </div>
        <div id="wxRange">최저 <span id="tmin">--</span>° · 최고 <span id="tmax">--</span>°</div>
      </summary>
      <div id="wxMore">
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 18h18M12 3v6M8 9l4-4 4 4M5 14l1 1M19 14l-1 1"/></svg>일출 <span id="sunrise">--:--</span></span>
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 18h18M12 9V3M8 5l4 4 4-4M5 14l1 1M19 14l-1 1"/></svg>일몰 <span id="sunset">--:--</span></span>
        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="1.8"><path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h9"/></svg>바람 <span id="wind">--</span> km/h</span>
      </div>
    </details>
    </div>
    <div id="class">
      <span id="classState">수업</span>
      <span id="classMain">—</span>
      <span id="classTime"></span>
    </div>
  </div>
  <div id="cal">
    <div id="calHead">
      <button class="nav" type="button" onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
      <div id="monthTitle">—</div>
      <button class="nav" type="button" onclick="moveMonth(1)" aria-label="다음 달">›</button>
    </div>
    <div id="grid" role="grid" aria-label="월간 달력"></div>
  </div>
</div>
<div id="mealRow" tabindex="0" role="button" aria-label="급식 전체 보기">
  <span id="mealLabel">급식</span>
  <span id="dishes" class="muted">불러오는 중…</span>
  <span id="kcal"></span>
</div>
<div id="ticker" data-mode="empty">
  <span id="tkTag">큐알림</span>
  <div id="tkRun" tabindex="0" role="button" aria-label="알림 전체 보기" aria-controls="detail" aria-expanded="false"><div id="tkTrack" class="still muted" aria-hidden="true">알림을 불러오는 중…</div></div>
  <button id="tkToggle" type="button" title="큐알림 일시정지" aria-label="큐알림 일시정지" aria-pressed="false" disabled>Ⅱ</button>
</div>

<div id="detail" role="dialog" aria-live="polite"><h4><span id="detailTitle"></span><span>창 밖을 누르거나 Esc로 닫기</span></h4><ul id="detailList"></ul></div>
</div><!-- /stage -->
<div id="alert" onclick="closeAlert()" role="alert" aria-live="assertive">
  <div id="alertTop">수업 시작</div>
  <div id="alertMain">—</div>
  <div id="alertSub"></div>
  <div id="alertHint">화면을 터치하면 닫힙니다</div>
</div>
<div id="err"></div>
<script>
/* ===== Apps Script 주소 ===== */
var API = 'https://script.google.com/macros/s/AKfycbxXYMueYS6ex0eoF3Xp1-WkDOvdSW6j9sYJeEbQ8gAN74ZEScEc-Fp8lm69J2OwtEzg0A/exec';
/* ===== 설정: 수정할 값은 이곳에 모아 둡니다 ===== */
var ALERT_SECONDS = 15;              // 수업 시작 전체화면 알림
var TICKER_SPEED = 40;               // 확대 전 CSS px/초. 작을수록 천천히 흐릅니다.
var TICKER_MODE = 'scroll';          // scroll: 항상 흐름 / auto: 기기 설정 존중 / rotate: 항목 교체 / static: 정지
var TICKER_ROTATE_SECONDS = 6;       // rotate 모드에서 항목을 바꾸는 간격
var TICKER_PAUSE_ON_DETAIL = false;  // true: 큐알림 상세를 열었을 때만 자동 일시정지
var LOAD_INTERVAL_MS = 60000;        // 데이터 갱신 간격
var REQUEST_TIMEOUT_MS = 15000;      // 응답 대기 한도

var DATA = null, viewY = null, viewM = null, lastNav = 0, cbSeq = 0;
var firedKey = null, alertTimer = null;
var DOW = ['일', '월', '화', '수', '목', '금', '토'];
var DOM = Object.create(null);
function $(id) { return DOM[id] || (DOM[id] = document.getElementById(id)); }
function p(n) { return (n < 10 ? '0' : '') + n; }
function dateKey(n) { return n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()); }
function setText(id, v) { var el = $(id); v = String(v); if (el.textContent !== v) el.textContent = v; }
function toMin(hhmm) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
  return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : NaN;
}
function objectOrEmpty(x) { return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; }

/* ===== JSONP: 동시 요청 방지 / 완료 시 타이머·script 정리 / 오래된 응답 무시 ===== */
var loadPending = false, loadTimer = null, lastLoadStarted = 0;
function load() {
  if (loadPending) return;
  clearTimeout(loadTimer);
  loadPending = true;
  lastLoadStarted = Date.now();
  var requestId = ++cbSeq;
  var name = 'qBoardCb' + requestId;
  var s = document.createElement('script');
  var done = false, timeoutId = null;
  function finish(error) {
    if (done) return;
    done = true;
    clearTimeout(timeoutId);
    s.onerror = s.onload = null;
    if (s.parentNode) s.parentNode.removeChild(s);
    // 이미 내려오는 중인 늦은 JSONP가 실행되어도 화면을 덮어쓰지 않는다.
    // 임시 콜백도 제거하여 24시간 실행 시 전역 함수가 계속 쌓이지 않게 한다.
    window[name] = function() {};
    setTimeout(function() { delete window[name]; }, Math.max(120000, REQUEST_TIMEOUT_MS * 2));
    loadPending = false;
    if (error) {
      setText('err', error + (DATA ? ' · 최근 정상 데이터 표시 중' : ''));
      if (!DATA) setMealState('급식을 불러오지 못했습니다');
    }
    loadTimer = setTimeout(load, Math.max(1000, LOAD_INTERVAL_MS - (Date.now() - lastLoadStarted)));
  }
  window[name] = function(d) {
    if (done || requestId !== cbSeq) return;
    try {
      onData(d);
      setText('err', '');
      finish('');
    } catch (error) {
      console.error('학사일정 응답 처리 실패:', error);
      finish('데이터 형식 확인 필요');
    }
  };
  s.async = true;
  s.onerror = function() { finish('데이터 연결 실패'); };
  s.onload = function() { if (!done) finish('JSONP 응답 형식 확인 필요'); };
  timeoutId = setTimeout(function() { finish('응답 지연'); }, REQUEST_TIMEOUT_MS);
  s.src = API + (API.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + encodeURIComponent(name) + '&t=' + Date.now();
  document.head.appendChild(s);
}

/* 원래 응답 필드(today, periods, timetable, eventMap, meal, weather, q)는 변경하지 않는다. */
function normalizeData(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d) || !/^\d{4}-\d{2}-\d{2}$/.test(d.today || '')) {
    throw new Error('today가 있는 데이터 객체가 필요합니다.');
  }
  var map = Object.create(null), rawMap = objectOrEmpty(d.eventMap);
  Object.keys(rawMap).forEach(function(ds) {
    if (!Array.isArray(rawMap[ds])) return;
    map[ds] = rawMap[ds].filter(function(e) { return e && e.text !== undefined && e.text !== null; })
      .map(function(e) { return { type: String(e.type || '일정'), text: String(e.text) }; });
  });

function tickerShouldPause() {
  var detail = $('detail');
  return tickerUserPaused || document.hidden ||
    (TICKER_PAUSE_ON_DETAIL && detail.classList.contains('on') && detail.dataset.kind === 'ticker');
}
function syncTickerPlayback() {
  var pause = tickerShouldPause();
  $('ticker').dataset.mode = tickerMode;
  $('ticker').classList.toggle('paused', pause);
  if (tickerAnimation) {
    if (pause) { if (tickerAnimation.playState !== 'paused') tickerAnimation.pause(); }
    else if (tickerAnimation.playState !== 'running') tickerAnimation.play();
  }
  var button = $('tkToggle');
  button.disabled = !tickerItems.length || tickerMode === 'static' || tickerMode === 'empty' || (tickerMode === 'rotate' && tickerItems.length < 2);
  button.textContent = tickerUserPaused ? '▶' : 'Ⅱ';
  button.setAttribute('aria-pressed', String(tickerUserPaused));
  var label = tickerUserPaused ? '큐알림 다시 재생' : '큐알림 일시정지';
  button.setAttribute('aria-label', label); button.title = label;
  if (pause || tickerMode !== 'rotate' || tickerItems.length < 2) {
    clearTimeout(tickerRotateTimer); tickerRotateTimer = null;
  } else if (!tickerRotateTimer) {
    var seconds = Number(TICKER_ROTATE_SECONDS);
    if (!Number.isFinite(seconds) || seconds < 1) seconds = 6;
    tickerRotateTimer = setTimeout(function() {
      tickerRotateTimer = null;
      if (tickerShouldPause() || tickerMode !== 'rotate' || !tickerItems.length) return;
      tickerIndex = (tickerIndex + 1) % tickerItems.length;
      showTickerStatic(); syncTickerPlayback();
    }, seconds * 1000);
  }
}
function initTicker() {
  $('tkToggle').addEventListener('click', function(e) {
    e.stopPropagation(); tickerUserPaused = !tickerUserPaused; syncTickerPlayback();
  });
  var resizeFrame = 0;
  window.addEventListener('resize', function() {
    if (resizeFrame) return;
    resizeFrame = requestAnimationFrame(function() { resizeFrame = 0; fitMode(); scheduleTickerLayout(true); });
  });
  if (typeof ResizeObserver === 'function') {
    var lastObservedWidth = -1;
    var observer = new ResizeObserver(function(entries) {
      var w = entries[0].contentRect.width;
      if (Math.abs(w - lastObservedWidth) > 0.05) { lastObservedWidth = w; scheduleTickerLayout(true); }
    });
    observer.observe($('tkRun'));
  }
  if (tickerMedia) {
    var onMotionChange = function() { if (TICKER_MODE === 'auto') scheduleTickerLayout(true); };
    if (tickerMedia.addEventListener) tickerMedia.addEventListener('change', onMotionChange);
    else if (tickerMedia.addListener) tickerMedia.addListener(onMotionChange);
  }
  if (document.fonts) {
    document.fonts.ready.then(function() { scheduleTickerLayout(true); });
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function() { scheduleTickerLayout(true); });
  }
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
      fitMode(); tick();
      if (DATA) renderTicker(lastQ);
      scheduleTickerLayout(true);
      if (Date.now() - lastLoadStarted >= LOAD_INTERVAL_MS) load();
    }
    syncTickerPlayback();
  });
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) { fitMode(); tick(); scheduleTickerLayout(true); load(); }
  });
  window.addEventListener('online', function() { load(); });
}
// 개발자 도구에서 QTicker.status()로 실제 재생 상태를 확인할 수 있다.
window.QTicker = {
  pause: function() { tickerUserPaused = true; syncTickerPlayback(); },
  resume: function() { tickerUserPaused = false; scheduleTickerLayout(); syncTickerPlayback(); },
  refresh: function() { renderTicker(lastQ); scheduleTickerLayout(true); },
  setSpeed: function(pxPerSecond) {
    if (!Number.isFinite(pxPerSecond) || pxPerSecond <= 0) throw new RangeError('속도는 0보다 큰 숫자여야 합니다.');
    TICKER_SPEED = pxPerSecond; scheduleTickerLayout(true);
  },
  setMode: function(mode) {
    if (['scroll', 'auto', 'rotate', 'static'].indexOf(mode) < 0) throw new RangeError('scroll / auto / rotate / static 중 하나를 사용하세요.');
    TICKER_MODE = mode; scheduleTickerLayout(true);
  },
  status: function() {
    return { mode: tickerMode, requestedMode: TICKER_MODE, reducedMotion: !!(tickerMedia && tickerMedia.matches), paused: tickerShouldPause(),
      userPaused: tickerUserPaused, count: tickerItems.length, copies: $('tkTrack').children.length,
      unitWidth: tickerUnitWidth, speed: tickerLastSpeed, durationSeconds: tickerDuration / 1000,
      phase: tickerPhase(), playState: tickerAnimation ? tickerAnimation.playState : 'none' };
  }
};

/* ===== 상세 보기 ===== */
function showDetail(title, rows, kind) {
  rows = Array.isArray(rows) ? rows : [];
  var box = $('detail');
  box.dataset.kind = kind || '';
  $('detailTitle').textContent = title;
  var ul = $('detailList'); ul.textContent = '';
  if (!rows || !rows.length) { var li0 = document.createElement('li'); li0.textContent = '내용 없음'; ul.appendChild(li0); }
  rows.forEach(function(r) {
    var li = document.createElement('li'); if (r.main) li.className = 'main';
    if (r.k) { var b = document.createElement('b'); b.textContent = r.k + ' '; li.appendChild(b); }
    li.appendChild(document.createTextNode(String(r.t)));
    ul.appendChild(li);
  });
  box.classList.add('on');
  $('tkRun').setAttribute('aria-expanded', kind === 'ticker' ? 'true' : 'false');
  syncTickerPlayback();
}
function hideDetail() { $('detail').classList.remove('on'); $('tkRun').setAttribute('aria-expanded', 'false'); syncTickerPlayback(); }
document.addEventListener('click', function(e) { if ($('detail').classList.contains('on') && !e.target.closest('#detail')) hideDetail(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeAlert(); hideDetail(); $('wx').open = false; } });
function bindDetail(id, fn) {
  var el = $(id);
  el.onclick = function(e) { e.stopPropagation(); if ($('detail').classList.contains('on')) { hideDetail(); return; } fn(); };
  el.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.onclick(e); } };
}
bindDetail('mealRow', function() {
  var rows = (MEAL && MEAL.hasMeal) ? MEAL.dishes.map(function(x) { return { t: x }; }) : [{ t: $('dishes').textContent }];
  if (MEAL && MEAL.kcal) rows.push({ k: '열량', t: MEAL.kcal });
  showDetail(((MEAL && MEAL.label) || '급식') + (MEAL && MEAL.date ? ' · ' + MEAL.date : ''), rows, 'meal');
});
bindDetail('tkRun', function() {   // 흐르는 글 전체(오늘 일정 + 큐 알림)를 멈춘 목록으로
  var now = dayItems().concat(liveItems(lastQ));   // 누르는 순간 기준으로 다시 계산(지난 알림은 빼고) — 강희 지적
  showDetail('오늘의 흐름' + (lastQ && lastQ.at ? ' · 큐알림 ' + lastQ.at : ''), now.map(function(x) { return { k: x.k, t: x.t }; }), 'ticker');
});
/* 기준 640×264보다 큰 창(예: Xeneon Edge 2560×720)은 같은 배치를 비율대로 키운다. 작은 창은 그대로 둔다. */
var STAGE_ZOOM = 1;
function fitZoom() {
  var k = Math.min(window.innerWidth / 640, window.innerHeight / 264);
  k = k > 1 ? Math.floor(k * 100) / 100 : 1;
  var st = $('stage');
  STAGE_ZOOM = k;
  st.style.zoom = k > 1 ? String(k) : '';
  /* 확대한 무대가 창을 꼭 채우게 무대 크기는 창/배율. 알림(#alert)은 무대 밖이라 배율과 무관하게 화면에 꼭 맞는다 */
  st.style.width = k > 1 ? (window.innerWidth / k) + 'px' : '100%';
  st.style.height = k > 1 ? (window.innerHeight / k) + 'px' : '100%';
}
/* 확대 뒤 높이가 320px 이상이면 달력 글자를 키우고, 400px 이상이면 둘째 일정 줄도 보인다 */
function fitMode() {
  fitZoom();
  var z = STAGE_ZOOM || 1;
  var h = window.innerHeight / z;
  document.body.classList.toggle('tall', h >= 320);
  document.body.classList.toggle('tall2', h >= 400);
}
fitMode();
initTicker();
tick();
setInterval(tick, 1000);
load();
</script>
